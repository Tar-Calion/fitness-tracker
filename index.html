<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Advanced Fitness Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">AFT</div>
      <div class="sidebar-logo-text">Advanced<span>Fitness Tracker</span></div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="history">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Historie
      </button>
      <button class="nav-item" data-view="analyse">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analyse
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-footer-title">Einstellungen</div>
      <div class="sidebar-btns-row">
        <button id="chooseFileBtn" class="sidebar-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Daten laden
        </button>
        <button id="createFileBtn" class="sidebar-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Neue Datei
        </button>
      </div>
      <div id="fileStatus">Keine Datei gewählt.</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <header class="header-bar">
      <div class="header-week-display" id="headerWeekDisplay"></div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle-btn" title="Hell/Dunkel umschalten">🌙</button>
      </div>
    </header>

    <div class="content-area">

      <!-- Dashboard View -->
      <div id="view-dashboard" class="view active">
        <div class="input-section">
          <div class="section-title">Heutige Aktivität</div>
          <div id="quickButtons"></div>
        </div>

        <div class="week-section">
          <div class="section-title">Wochenübersicht</div>
          <div id="weekView" class="week-grid"></div>
        </div>

        <div id="weekProgress" class="progress-section"></div>

        <div class="chart-section">
          <div class="section-title">Letzte 15 Wochen</div>
          <div class="chart-canvas-wrap">
            <canvas id="barChart"></canvas>
          </div>
        </div>
      </div>

      <!-- History View -->
      <div id="view-history" class="view">
        <div class="history-header">
          <div class="headline-sm">Historie</div>
          <div class="history-filters">
            <label class="filter-label">Von</label>
            <input type="date" id="historyDateFrom" class="filter-input" />
            <label class="filter-label">Bis</label>
            <input type="date" id="historyDateTo" class="filter-input" />
            <button id="historyResetFilter" class="filter-reset-btn" title="Filter zurücksetzen">✕</button>
            <select id="historySortBy" class="filter-select">
              <option value="date-desc">Neueste zuerst</option>
              <option value="date-asc">Älteste zuerst</option>
              <option value="minutes-desc">Meiste Minuten</option>
              <option value="minutes-asc">Wenigste Minuten</option>
            </select>
          </div>
          <button id="addEntryBtn" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Neuer Eintrag
          </button>
        </div>
        <div id="historyTableWrap"></div>
      </div>

      <!-- Analyse View -->
      <div id="view-analyse" class="view">
        <div class="headline-sm" style="margin-bottom:var(--sp-6)">Analyse</div>
        <div id="analyseStats" class="stats-grid"></div>
        <div class="analyse-charts-grid">
          <div class="analyse-chart-card">
            <div class="card-title">Monatlicher Trend</div>
            <div class="analyse-chart-wrap">
              <canvas id="trendChart"></canvas>
            </div>
          </div>
          <div class="analyse-chart-card">
            <div class="card-title">Verhältnis Moderat / Intensiv</div>
            <div class="analyse-chart-wrap">
              <canvas id="ratioChart"></canvas>
            </div>
            <div id="ratioLegend" class="ratio-legend"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="renderer.js"></script>
</body>
</html>
